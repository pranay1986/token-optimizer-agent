[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-optimizer-agent"
version = "1.0.0"
description = "Agentic system that reduces LLM token usage through semantic caching, context optimization, and budget management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Token Optimizer Team"}
]
keywords = ["llm", "token", "optimization", "cache", "budget", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
token-optimizer = "token_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["token_optimizer*"]

[tool.ruff]
line-length = 100
target-version = "py310"
